name: Debian 13

# Weekly rebuild so the base image carries current security updates.
# Pull requests build and verify but never publish.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "debian-13/**"
      - ".github/workflows/debian-13.yml"
  schedule:
    - cron: "23 7 * * 1" # Mondays 07:23 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: debian-13-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7

      - name: Install image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libguestfs-tools qemu-utils
          # libguestfs boots its appliance with the host kernel, which Ubuntu
          # ships root-only readable.
          sudo chmod 0644 /boot/vmlinuz-*
          # passt (libguestfs' default appliance networking) exits 1 under
          # Ubuntu's AppArmor profile on these runners. With it unavailable,
          # libguestfs falls back to QEMU user networking, which works.
          if [ -x /usr/bin/passt ]; then sudo mv /usr/bin/passt /usr/bin/passt.disabled; fi
          # libguestfs copies the host resolv.conf into the appliance. The
          # runner's points at the systemd-resolved stub (127.0.0.53), which
          # inside the appliance is the appliance itself. Use the real
          # upstream resolvers instead.
          sudo ln -sf /run/systemd/resolve/resolv.conf /etc/resolv.conf
          # Use KVM when the runner exposes it; libguestfs falls back to TCG.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Diagnose appliance networking (temporary)
        if: github.event_name == 'pull_request'
        env:
          LIBGUESTFS_BACKEND: direct
        run: |
          set +e
          echo "== host resolv.conf"; cat /etc/resolv.conf
          echo "== passt version"; /usr/bin/passt.disabled --version 2>&1 | head -1
          echo "== appliance WITH passt"
          sudo mv /usr/bin/passt.disabled /usr/bin/passt
          LIBGUESTFS_DEBUG=1 guestfish --network -a /dev/null run : debug sh "cat /etc/resolv.conf; ip -4 addr; ip route; getent hosts deb.debian.org" 2>&1 | grep -iE 'passt|resolv|nameserver|inet |default via|deb.debian|error|denied' | head -40
          sudo mv /usr/bin/passt /usr/bin/passt.disabled
          echo "== appliance WITHOUT passt"
          guestfish --network -a /dev/null run : debug sh "cat /etc/resolv.conf; ip -4 addr; ip route; getent hosts deb.debian.org" 2>&1 | head -30
          echo "== dmesg apparmor"; sudo dmesg | grep -i apparmor | grep -i passt | tail -5

      - name: Build
        id: build
        env:
          LIBGUESTFS_BACKEND: direct
          OUT_DIR: out
        run: bash debian-13/build.sh

      - name: Attest provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: out/${{ steps.build.outputs.name }}.qcow2

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.build.outputs.name }}
        run: |
          if gh release view "$NAME" > /dev/null 2>&1; then
            echo "Release $NAME already exists; nothing to publish."
            exit 0
          fi
          upstream=$(jq -r .upstream.url out/build-info.json)
          agent=$(jq -r .qemu_guest_agent out/build-info.json)
          sha=$(jq -r .sha512 out/build-info.json)
          gh release create "$NAME" \
            "out/$NAME.qcow2" "out/$NAME.qcow2.sha512" out/build-info.json \
            --title "$NAME" \
            --notes "Official Debian 13 genericcloud with current updates and qemu-guest-agent \`$agent\`.

          - Source: $upstream
          - SHA-512: \`$sha\`
          - Provenance: \`gh attestation verify $NAME.qcow2 --repo ${{ github.repository }}\`"
